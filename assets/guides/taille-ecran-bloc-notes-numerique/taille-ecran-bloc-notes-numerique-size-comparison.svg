<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Comparaison visuelle de plusieurs tailles d&#x27;écran courantes pour les bloc-notes numériques.</title><desc id="svg-desc">Les tailles sont illustratives : vérifiez toujours les dimensions physiques du modèle précis.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#202321" flood-opacity="0.08"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9A9D98"/></marker></defs>
<rect width="1200" height="620" rx="28" fill="#F7F6F1"/><text x="60" y="58" font-family="Newsreader, Georgia, serif" font-size="38" font-weight="600" fill="#202321">La taille d&#x27;écran change la surface de travail et la mobilité</text><text x="60" y="92" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#6B6E6A">Comparez le format au document que vous manipulez le plus souvent.</text><g filter="url(#shadow)"><rect x="62.0" y="292.0" width="156.0" height="208.0" rx="12" fill="#FFFFFF" stroke="#52675A" stroke-width="3"/><rect x="74.0" y="304.0" width="132.0" height="184.0" rx="8" fill="#ECECE7"/><text x="140" y="534" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="17" fill="#202321"><tspan x="140" y="534" font-weight="700">7,8″</tspan><tspan x="140" y="558" font-weight="500">Très mobile</tspan></text><rect x="297.0" y="226.0" width="206.0" height="274.0" rx="12" fill="#FFFFFF" stroke="#52675A" stroke-width="3"/><rect x="309.0" y="238.0" width="182.0" height="250.0" rx="8" fill="#ECECE7"/><text x="400" y="534" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="17" fill="#202321"><tspan x="400" y="534" font-weight="700">10,3″</tspan><tspan x="400" y="558" font-weight="500">Compromis courant</tspan></text><rect x="562.0" y="186.0" width="236.0" height="314.0" rx="12" fill="#FFFFFF" stroke="#52675A" stroke-width="3"/><rect x="574.0" y="198.0" width="212.0" height="290.0" rx="8" fill="#ECECE7"/><text x="680" y="534" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="17" fill="#202321"><tspan x="680" y="534" font-weight="700">11,8″</tspan><tspan x="680" y="558" font-weight="500">Plus de surface</tspan></text><rect x="827.0" y="146.0" width="266.0" height="354.0" rx="12" fill="#FFFFFF" stroke="#52675A" stroke-width="3"/><rect x="839.0" y="158.0" width="242.0" height="330.0" rx="8" fill="#ECECE7"/><text x="960" y="534" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="17" fill="#202321"><tspan x="960" y="534" font-weight="700">13,3″</tspan><tspan x="960" y="558" font-weight="500">Grands PDF</tspan></text></g></svg>