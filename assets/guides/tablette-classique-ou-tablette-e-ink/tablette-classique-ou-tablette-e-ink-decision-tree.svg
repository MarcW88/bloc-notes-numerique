<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Arbre de décision entre tablette classique et tablette E Ink selon les applications, la vidéo et le temps passé à lire ou écrire.</title><desc id="svg-desc">Le schéma montre l&#x27;ordre de décision ; le tableau HTML conserve la comparaison détaillée.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#202321" flood-opacity="0.08"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9A9D98"/></marker></defs>
<rect width="1200" height="700" rx="28" fill="#F7F6F1"/><text x="60" y="58" font-family="Newsreader, Georgia, serif" font-size="38" font-weight="600" fill="#202321">Tablette classique ou E Ink : identifiez votre contrainte éliminatoire</text><text x="60" y="92" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#6B6E6A">Commencez par ce qui doit absolument fonctionner.</text><g filter="url(#shadow)"><path d="M 600.0 190 C 600.0 250.0, 290.0 250.0, 290.0 310" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="407.0" y="225.0" width="76" height="28" rx="14" fill="#F7F6F1"/><text x="445.0" y="245.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B6E6A">Oui</text><path d="M 600.0 190 C 600.0 250.0, 910.0 250.0, 910.0 310" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="717.0" y="225.0" width="76" height="28" rx="14" fill="#F7F6F1"/><text x="755.0" y="245.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B6E6A">Non</text><path d="M 910.0 425 C 910.0 482.5, 910.0 482.5, 910.0 540" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="872.0" y="457.5" width="76" height="28" rx="14" fill="#F7F6F1"/><text x="910.0" y="477.5" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B6E6A">Oui</text><path d="M 910.0 425 C 910.0 482.5, 290.0 482.5, 290.0 540" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="562.0" y="457.5" width="76" height="28" rx="14" fill="#F7F6F1"/><text x="600.0" y="477.5" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B6E6A">Non</text><rect x="390" y="100" width="420" height="90" rx="18" fill="#52675A" stroke="#52675A" stroke-width="2"/><text x="600.0" y="138.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#FFFFFF"><tspan x="600.0" y="138.0" font-weight="700">Avez-vous besoin</tspan><tspan x="600.0" y="166.0" font-weight="500">d&#x27;apps, vidéo ou animation ?</tspan></text><rect x="90" y="310" width="400" height="115" rx="18" fill="#F4E5DF" stroke="#C66A4A" stroke-width="2"/><text x="290.0" y="346.5" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#202321"><tspan x="290.0" y="346.5" font-weight="700">Oui</tspan><tspan x="290.0" y="374.5" font-weight="500">tablette classique</tspan><tspan x="290.0" y="402.5" font-weight="500">à examiner en priorité</tspan></text><rect x="710" y="310" width="400" height="115" rx="18" fill="#ECECE7" stroke="#D8D9D3" stroke-width="2"/><text x="910.0" y="346.5" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#202321"><tspan x="910.0" y="346.5" font-weight="700">Non</tspan><tspan x="910.0" y="374.5" font-weight="500">passez-vous surtout</tspan><tspan x="910.0" y="402.5" font-weight="500">du temps à lire et écrire ?</tspan></text><rect x="690" y="540" width="440" height="125" rx="18" fill="#F4E5DF" stroke="#C66A4A" stroke-width="2"/><text x="910.0" y="581.5" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#202321"><tspan x="910.0" y="581.5" font-weight="700">Oui</tspan><tspan x="910.0" y="609.5" font-weight="500">E Ink devient cohérent</tspan><tspan x="910.0" y="637.5" font-weight="500">si le workflow suit</tspan></text><rect x="70" y="540" width="440" height="125" rx="18" fill="#ECECE7" stroke="#D8D9D3" stroke-width="2"/><text x="290.0" y="581.5" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#202321"><tspan x="290.0" y="581.5" font-weight="700">Non</tspan><tspan x="290.0" y="609.5" font-weight="500">la polyvalence d&#x27;une</tspan><tspan x="290.0" y="637.5" font-weight="500">tablette classique reste utile</tspan></text></g></svg>