<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 632" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Matrice comparant tablette classique et tablette E Ink selon plusieurs usages.</title><desc id="svg-desc">Le choix dépend surtout des applications indispensables et du temps passé à lire ou écrire.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#202321" flood-opacity="0.08"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9A9D98"/></marker></defs>
<rect width="1200" height="632" rx="28" fill="#F7F6F1"/><text x="60" y="58" font-family="Newsreader, Georgia, serif" font-size="38" font-weight="600" fill="#202321">Tablette classique ou E Ink : le compromis principal</text><text x="60" y="92" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#6B6E6A">Polyvalence et multimédia d&#x27;un côté, lecture/écriture spécialisée de l&#x27;autre.</text><g filter="url(#shadow)"><rect x="60.0" y="145" width="360.0" height="72" fill="#52675A" stroke="#FFFFFF" stroke-width="1"/><text x="240.0" y="189" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="16" fill="#FFFFFF"><tspan x="240.0" y="189" font-weight="700">Usage</tspan></text><rect x="420.0" y="145" width="360.0" height="72" fill="#52675A" stroke="#FFFFFF" stroke-width="1"/><text x="600.0" y="189" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="16" fill="#FFFFFF"><tspan x="600.0" y="189" font-weight="700">Tablette classique</tspan></text><rect x="780.0" y="145" width="360.0" height="72" fill="#52675A" stroke="#FFFFFF" stroke-width="1"/><text x="960.0" y="189" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="16" fill="#FFFFFF"><tspan x="960.0" y="189" font-weight="700">Tablette E Ink</tspan></text><rect x="60.0" y="217" width="360.0" height="72" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="1"/><text x="240.0" y="260" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#202321"><tspan x="240.0" y="260" font-weight="700">Applications</tspan></text><rect x="420.0" y="217" width="360.0" height="72" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="1"/><text x="600.0" y="260" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#202321"><tspan x="600.0" y="260" font-weight="700">Très large choix</tspan></text><rect x="780.0" y="217" width="360.0" height="72" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="1"/><text x="960.0" y="260" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#202321"><tspan x="960.0" y="260" font-weight="700">Variable selon le système</tspan></text><rect x="60.0" y="289" width="360.0" height="72" fill="#ECECE7" stroke="#D8D9D3" stroke-width="1"/><text x="240.0" y="332" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#202321"><tspan x="240.0" y="332" font-weight="700">Vidéo / animation</tspan></text><rect x="420.0" y="289" width="360.0" height="72" fill="#ECECE7" stroke="#D8D9D3" stroke-width="1"/><text x="600.0" y="332" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#202321"><tspan x="600.0" y="332" font-weight="700">Adaptée</tspan></text><rect x="780.0" y="289" width="360.0" height="72" fill="#ECECE7" stroke="#D8D9D3" stroke-width="1"/><text x="960.0" y="332" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#202321"><tspan x="960.0" y="332" font-weight="700">Peu adaptée</tspan></text><rect x="60.0" y="361" width="360.0" height="72" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="1"/><text x="240.0" y="404" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#202321"><tspan x="240.0" y="404" font-weight="700">Lecture longue</tspan></text><rect x="420.0" y="361" width="360.0" height="72" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="1"/><text x="600.0" y="404" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#202321"><tspan x="600.0" y="404" font-weight="700">Écran lumineux</tspan></text><rect x="780.0" y="361" width="360.0" height="72" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="1"/><text x="960.0" y="404" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#202321"><tspan x="960.0" y="404" font-weight="700">Affichage papier</tspan></text><rect x="60.0" y="433" width="360.0" height="72" fill="#ECECE7" stroke="#D8D9D3" stroke-width="1"/><text x="240.0" y="476" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#202321"><tspan x="240.0" y="476" font-weight="700">Écriture / PDF</tspan></text><rect x="420.0" y="433" width="360.0" height="72" fill="#ECECE7" stroke="#D8D9D3" stroke-width="1"/><text x="600.0" y="476" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#202321"><tspan x="600.0" y="476" font-weight="700">Polyvalente</tspan></text><rect x="780.0" y="433" width="360.0" height="72" fill="#ECECE7" stroke="#D8D9D3" stroke-width="1"/><text x="960.0" y="476" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#202321"><tspan x="960.0" y="476" font-weight="700">Souvent spécialisée</tspan></text><rect x="60.0" y="505" width="360.0" height="72" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="1"/><text x="240.0" y="548" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#202321"><tspan x="240.0" y="548" font-weight="700">Autonomie</tspan></text><rect x="420.0" y="505" width="360.0" height="72" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="1"/><text x="600.0" y="548" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#202321"><tspan x="600.0" y="548" font-weight="700">Recharge plus fréquente</tspan></text><rect x="780.0" y="505" width="360.0" height="72" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="1"/><text x="960.0" y="548" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#202321"><tspan x="960.0" y="548" font-weight="700">Souvent plus longue</tspan></text></g></svg>