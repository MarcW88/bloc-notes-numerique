<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Arbre de décision pour choisir entre un écran E Ink couleur et noir et blanc.</title><desc id="svg-desc">Choisissez la couleur lorsqu&#x27;elle transporte une information utile dans vos documents ou annotations.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#202321" flood-opacity="0.08"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9A9D98"/></marker></defs>
<rect width="1200" height="700" rx="28" fill="#F7F6F1"/><text x="60" y="58" font-family="Newsreader, Georgia, serif" font-size="38" font-weight="600" fill="#202321">La couleur change-t-elle réellement votre travail ?</text><text x="60" y="92" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#6B6E6A">Le bon critère est l&#x27;information portée par la couleur.</text><g filter="url(#shadow)"><path d="M 600.0 202 C 600.0 261.0, 320.0 261.0, 320.0 320" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="422.0" y="236.0" width="76" height="28" rx="14" fill="#F7F6F1"/><text x="460.0" y="256.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B6E6A">Oui</text><path d="M 600.0 202 C 600.0 261.0, 880.0 261.0, 880.0 320" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="702.0" y="236.0" width="76" height="28" rx="14" fill="#F7F6F1"/><text x="740.0" y="256.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B6E6A">Non</text><path d="M 320.0 430 C 320.0 495.0, 320.0 495.0, 320.0 560" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 880.0 430 C 880.0 495.0, 880.0 495.0, 880.0 560" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="390" y="120" width="420" height="82" rx="18" fill="#52675A" stroke="#52675A" stroke-width="2"/><text x="600.0" y="154.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#FFFFFF"><tspan x="600.0" y="154.0" font-weight="700">La couleur porte-t-elle</tspan><tspan x="600.0" y="182.0" font-weight="500">une information utile ?</tspan></text><rect x="130" y="320" width="380" height="110" rx="18" fill="#ECECE7" stroke="#D8D9D3" stroke-width="2"/><text x="320.0" y="354.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#202321"><tspan x="320.0" y="354.0" font-weight="700">Oui</tspan><tspan x="320.0" y="382.0" font-weight="500">schémas, corrections,</tspan><tspan x="320.0" y="410.0" font-weight="500">légendes ou repères</tspan></text><rect x="690" y="320" width="380" height="110" rx="18" fill="#ECECE7" stroke="#D8D9D3" stroke-width="2"/><text x="880.0" y="354.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#202321"><tspan x="880.0" y="354.0" font-weight="700">Non</tspan><tspan x="880.0" y="382.0" font-weight="500">texte, notes et PDF</tspan><tspan x="880.0" y="410.0" font-weight="500">principalement monochromes</tspan></text><rect x="130" y="560" width="380" height="120" rx="18" fill="#F4E5DF" stroke="#C66A4A" stroke-width="2"/><text x="320.0" y="599.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#202321"><tspan x="320.0" y="599.0" font-weight="700">Examinez les modèles</tspan><tspan x="320.0" y="627.0" font-weight="500">E Ink couleur</tspan><tspan x="320.0" y="655.0" font-weight="500">et leurs compromis</tspan></text><rect x="690" y="560" width="380" height="120" rx="18" fill="#F4E5DF" stroke="#C66A4A" stroke-width="2"/><text x="880.0" y="599.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#202321"><tspan x="880.0" y="599.0" font-weight="700">Le noir et blanc</tspan><tspan x="880.0" y="627.0" font-weight="500">peut rester le choix</tspan><tspan x="880.0" y="655.0" font-weight="500">le plus simple</tspan></text></g></svg>