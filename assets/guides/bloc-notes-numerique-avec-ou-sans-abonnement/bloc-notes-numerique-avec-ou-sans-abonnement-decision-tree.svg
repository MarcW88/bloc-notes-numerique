<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Arbre de décision pour savoir si un abonnement doit peser dans le choix d&#x27;un bloc-notes numérique.</title><desc id="svg-desc">Un abonnement ne doit compter que s&#x27;il touche une fonction dont vous avez réellement besoin.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#202321" flood-opacity="0.08"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9A9D98"/></marker></defs>
<rect width="1200" height="700" rx="28" fill="#F7F6F1"/><text x="60" y="58" font-family="Newsreader, Georgia, serif" font-size="38" font-weight="600" fill="#202321">L&#x27;abonnement est-il un vrai critère d&#x27;achat ?</text><text x="60" y="92" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#6B6E6A">Séparez fonctions essentielles, confort cloud et services optionnels.</text><g filter="url(#shadow)"><path d="M 600.0 212 C 600.0 271.0, 315.0 271.0, 315.0 330" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="419.5" y="246.0" width="76" height="28" rx="14" fill="#F7F6F1"/><text x="457.5" y="266.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B6E6A">Oui</text><path d="M 600.0 212 C 600.0 271.0, 885.0 271.0, 885.0 330" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="704.5" y="246.0" width="76" height="28" rx="14" fill="#F7F6F1"/><text x="742.5" y="266.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B6E6A">Non</text><path d="M 315.0 430 C 315.0 495.0, 315.0 495.0, 315.0 560" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 885.0 430 C 885.0 495.0, 885.0 495.0, 885.0 560" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="390" y="130" width="420" height="82" rx="18" fill="#52675A" stroke="#52675A" stroke-width="2"/><text x="600.0" y="164.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#FFFFFF"><tspan x="600.0" y="164.0" font-weight="700">Une fonction essentielle</tspan><tspan x="600.0" y="192.0" font-weight="500">dépend-elle d&#x27;un abonnement ?</tspan></text><rect x="150" y="330" width="330" height="100" rx="18" fill="#ECECE7" stroke="#D8D9D3" stroke-width="2"/><text x="315.0" y="373.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#202321"><tspan x="315.0" y="373.0" font-weight="700">Oui</tspan><tspan x="315.0" y="401.0" font-weight="500">Calculez le coût récurrent</tspan></text><rect x="720" y="330" width="330" height="100" rx="18" fill="#ECECE7" stroke="#D8D9D3" stroke-width="2"/><text x="885.0" y="373.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#202321"><tspan x="885.0" y="373.0" font-weight="700">Non</tspan><tspan x="885.0" y="401.0" font-weight="500">Comparez d&#x27;abord l&#x27;usage</tspan></text><rect x="130" y="560" width="370" height="120" rx="18" fill="#F4E5DF" stroke="#C66A4A" stroke-width="2"/><text x="315.0" y="599.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#202321"><tspan x="315.0" y="599.0" font-weight="700">Vérifiez la dépendance</tspan><tspan x="315.0" y="627.0" font-weight="500">cloud, stockage, export</tspan><tspan x="315.0" y="655.0" font-weight="500">ou fonctions avancées</tspan></text><rect x="700" y="560" width="370" height="120" rx="18" fill="#F4E5DF" stroke="#C66A4A" stroke-width="2"/><text x="885.0" y="599.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#202321"><tspan x="885.0" y="599.0" font-weight="700">Traitez l&#x27;abonnement</tspan><tspan x="885.0" y="627.0" font-weight="500">comme un confort</tspan><tspan x="885.0" y="655.0" font-weight="500">et non un coût obligatoire</tspan></text></g></svg>