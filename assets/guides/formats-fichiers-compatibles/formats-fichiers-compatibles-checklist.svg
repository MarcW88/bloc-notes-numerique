<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 657" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Checklist pour vérifier la compatibilité réelle d&#x27;un format de fichier sur une tablette E Ink.</title><desc id="svg-desc">Testez le fichier réel, son annotation et sa sortie plutôt que le seul nom du format.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#202321" flood-opacity="0.08"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9A9D98"/></marker></defs>
<rect width="1200" height="657" rx="28" fill="#F7F6F1"/><text x="60" y="58" font-family="Newsreader, Georgia, serif" font-size="38" font-weight="600" fill="#202321">5 vérifications avant de déclarer un format compatible</text><text x="60" y="92" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#6B6E6A">« Pris en charge » ne veut pas toujours dire « utilisable dans votre workflow ».</text><g filter="url(#shadow)"><rect x="70" y="145" width="510" height="125" rx="18" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="2"/><circle cx="112" cy="187" r="20" fill="#52675A"/><text x="112" y="194" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">1</text><text x="150" y="185" text-anchor="start" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#202321"><tspan x="150" y="185" font-weight="700">Ouverture</tspan><tspan x="150" y="211" font-weight="500">Le fichier s&#x27;ouvre-t-il correctement ?</tspan></text><rect x="620" y="145" width="510" height="125" rx="18" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="2"/><circle cx="662" cy="187" r="20" fill="#52675A"/><text x="662" y="194" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">2</text><text x="700" y="185" text-anchor="start" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#202321"><tspan x="700" y="185" font-weight="700">Mise en page</tspan><tspan x="700" y="211" font-weight="500">Le contenu reste-t-il lisible ?</tspan></text><rect x="70" y="294" width="510" height="125" rx="18" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="2"/><circle cx="112" cy="336" r="20" fill="#52675A"/><text x="112" y="343" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">3</text><text x="150" y="334" text-anchor="start" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#202321"><tspan x="150" y="334" font-weight="700">Annotation</tspan><tspan x="150" y="360" font-weight="500">Pouvez-vous écrire ou surligner comme prévu ?</tspan></text><rect x="620" y="294" width="510" height="125" rx="18" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="2"/><circle cx="662" cy="336" r="20" fill="#52675A"/><text x="662" y="343" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">4</text><text x="700" y="334" text-anchor="start" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#202321"><tspan x="700" y="334" font-weight="700">Export</tspan><tspan x="700" y="360" font-weight="500">Les annotations ressortent-elles dans un format exploitable ?</tspan></text><rect x="70" y="443" width="510" height="125" rx="18" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="2"/><circle cx="112" cy="485" r="20" fill="#52675A"/><text x="112" y="492" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">5</text><text x="150" y="483" text-anchor="start" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#202321"><tspan x="150" y="483" font-weight="700">Protection</tspan><tspan x="150" y="509" font-weight="500">DRM, compte ou conversion imposent-ils une étape supplémentaire ?</tspan></text></g></svg>