<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Schéma du traitement OCR d&#x27;une note manuscrite jusqu&#x27;au texte réutilisable.</title><desc id="svg-desc">La reconnaissance produit un brouillon à vérifier, pas une transcription infaillible.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#202321" flood-opacity="0.08"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9A9D98"/></marker></defs>
<rect width="1200" height="390" rx="28" fill="#F7F6F1"/><text x="60" y="58" font-family="Newsreader, Georgia, serif" font-size="38" font-weight="600" fill="#202321">Ce que fait réellement l&#x27;OCR manuscrit</text><text x="60" y="92" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#6B6E6A">Reconnaître, relire, puis réutiliser.</text><g filter="url(#shadow)"><rect x="70.0" y="160" width="248.5" height="160" rx="18" fill="#52675A" stroke="#52675A" stroke-width="2"/><text x="194.25" y="233.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#FFFFFF"><tspan x="194.25" y="233.0" font-weight="700">Manuscrit</tspan><tspan x="194.25" y="261.0" font-weight="500">Écriture capturée</tspan></text><path d="M 318.5 240.0 L 335.5 240.0" stroke="#9A9D98" stroke-width="3" marker-end="url(#arrow)"/><rect x="340.5" y="160" width="248.5" height="160" rx="18" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="2"/><text x="464.75" y="233.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#202321"><tspan x="464.75" y="233.0" font-weight="700">Reconnaissance</tspan><tspan x="464.75" y="261.0" font-weight="500">Analyse des caractères</tspan></text><path d="M 589.0 240.0 L 606.0 240.0" stroke="#9A9D98" stroke-width="3" marker-end="url(#arrow)"/><rect x="611.0" y="160" width="248.5" height="160" rx="18" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="2"/><text x="735.25" y="233.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#202321"><tspan x="735.25" y="233.0" font-weight="700">Correction</tspan><tspan x="735.25" y="261.0" font-weight="500">Vérifier noms et erreurs</tspan></text><path d="M 859.5 240.0 L 876.5 240.0" stroke="#9A9D98" stroke-width="3" marker-end="url(#arrow)"/><rect x="881.5" y="160" width="248.5" height="160" rx="18" fill="#F4E5DF" stroke="#C66A4A" stroke-width="2"/><text x="1005.75" y="233.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#202321"><tspan x="1005.75" y="233.0" font-weight="700">Réutilisation</tspan><tspan x="1005.75" y="261.0" font-weight="500">Copier, exporter ou rechercher</tspan></text></g></svg>