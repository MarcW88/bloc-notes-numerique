<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Arbre de décision pour choisir entre un écosystème spécialisé et un écosystème plus ouvert selon les applications et intégrations nécessaires.</title><desc id="svg-desc">Le visuel complète le tableau : il montre le chemin de décision plutôt que de répéter les mêmes critères.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#202321" flood-opacity="0.08"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9A9D98"/></marker></defs>
<rect width="1200" height="700" rx="28" fill="#F7F6F1"/><text x="60" y="58" font-family="Newsreader, Georgia, serif" font-size="38" font-weight="600" fill="#202321">Ouvert ou fermé : partez de vos contraintes logicielles</text><text x="60" y="92" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#6B6E6A">Le bon choix dépend surtout des applications et transferts indispensables.</text><g filter="url(#shadow)"><path d="M 600.0 202 C 600.0 251.0, 290.0 251.0, 290.0 300" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="407.0" y="226.0" width="76" height="28" rx="14" fill="#F7F6F1"/><text x="445.0" y="246.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B6E6A">Oui</text><path d="M 600.0 202 C 600.0 251.0, 910.0 251.0, 910.0 300" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="717.0" y="226.0" width="76" height="28" rx="14" fill="#F7F6F1"/><text x="755.0" y="246.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B6E6A">Non</text><path d="M 290.0 405 C 290.0 467.5, 290.0 467.5, 290.0 530" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 910.0 405 C 910.0 467.5, 910.0 467.5, 910.0 530" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="390" y="110" width="420" height="92" rx="18" fill="#52675A" stroke="#52675A" stroke-width="2"/><text x="600.0" y="149.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#FFFFFF"><tspan x="600.0" y="149.0" font-weight="700">Avez-vous besoin</tspan><tspan x="600.0" y="177.0" font-weight="500">d’applications tierces précises ?</tspan></text><rect x="90" y="300" width="400" height="105" rx="18" fill="#ECECE7" stroke="#D8D9D3" stroke-width="2"/><text x="290.0" y="331.5" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#202321"><tspan x="290.0" y="331.5" font-weight="700">Oui</tspan><tspan x="290.0" y="359.5" font-weight="500">vérifiez leur disponibilité</tspan><tspan x="290.0" y="387.5" font-weight="500">et leurs droits d’accès</tspan></text><rect x="710" y="300" width="400" height="105" rx="18" fill="#ECECE7" stroke="#D8D9D3" stroke-width="2"/><text x="910.0" y="331.5" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#202321"><tspan x="910.0" y="331.5" font-weight="700">Non</tspan><tspan x="910.0" y="359.5" font-weight="500">un workflow spécialisé</tspan><tspan x="910.0" y="387.5" font-weight="500">peut suffire</tspan></text><rect x="70" y="530" width="440" height="125" rx="18" fill="#F4E5DF" stroke="#C66A4A" stroke-width="2"/><text x="290.0" y="571.5" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#202321"><tspan x="290.0" y="571.5" font-weight="700">Priorité : ouverture</tspan><tspan x="290.0" y="599.5" font-weight="500">apps, cloud, partage</tspan><tspan x="290.0" y="627.5" font-weight="500">et intégrations tierces</tspan></text><rect x="690" y="530" width="440" height="125" rx="18" fill="#F4E5DF" stroke="#C66A4A" stroke-width="2"/><text x="910.0" y="571.5" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#202321"><tspan x="910.0" y="571.5" font-weight="700">Priorité : simplicité</tspan><tspan x="910.0" y="599.5" font-weight="500">workflow cohérent</tspan><tspan x="910.0" y="627.5" font-weight="500">et moins de réglages</tspan></text></g></svg>