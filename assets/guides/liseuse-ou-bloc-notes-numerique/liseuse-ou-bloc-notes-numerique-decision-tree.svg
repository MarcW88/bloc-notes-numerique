<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Arbre de décision entre liseuse, appareil hybride avec stylet et bloc-notes numérique selon la place de la lecture, de l&#x27;écriture et de l&#x27;export.</title><desc id="svg-desc">Utilisez le tableau pour les détails et ce schéma uniquement pour le chemin de décision.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#202321" flood-opacity="0.08"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9A9D98"/></marker></defs>
<rect width="1200" height="700" rx="28" fill="#F7F6F1"/><text x="60" y="58" font-family="Newsreader, Georgia, serif" font-size="38" font-weight="600" fill="#202321">Liseuse, hybride ou bloc-notes : partez de l&#x27;activité dominante</text><text x="60" y="92" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#6B6E6A">Le tableau détaille les fonctions ; ce schéma montre la bifurcation de choix.</text><g filter="url(#shadow)"><path d="M 600.0 190 C 600.0 235.0, 280.0 235.0, 280.0 280" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="402.0" y="210.0" width="76" height="28" rx="14" fill="#F7F6F1"/><text x="440.0" y="230.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B6E6A">Oui</text><path d="M 600.0 190 C 600.0 235.0, 920.0 235.0, 920.0 280" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="722.0" y="210.0" width="76" height="28" rx="14" fill="#F7F6F1"/><text x="760.0" y="230.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B6E6A">Non</text><path d="M 280.0 385 C 280.0 452.5, 190.0 452.5, 190.0 520" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="197.0" y="427.5" width="76" height="28" rx="14" fill="#F7F6F1"/><text x="235.0" y="447.5" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B6E6A">Oui</text><path d="M 280.0 385 C 280.0 452.5, 600.0 452.5, 600.0 520" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="402.0" y="427.5" width="76" height="28" rx="14" fill="#F7F6F1"/><text x="440.0" y="447.5" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B6E6A">Non</text><path d="M 920.0 385 C 920.0 452.5, 1010.0 452.5, 1010.0 520" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="390" y="100" width="420" height="90" rx="18" fill="#52675A" stroke="#52675A" stroke-width="2"/><text x="600.0" y="138.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#FFFFFF"><tspan x="600.0" y="138.0" font-weight="700">Votre activité dominante</tspan><tspan x="600.0" y="166.0" font-weight="500">est-elle la lecture ?</tspan></text><rect x="80" y="280" width="400" height="105" rx="18" fill="#ECECE7" stroke="#D8D9D3" stroke-width="2"/><text x="280.0" y="311.5" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#202321"><tspan x="280.0" y="311.5" font-weight="700">Oui</tspan><tspan x="280.0" y="339.5" font-weight="500">les notes servent-elles</tspan><tspan x="280.0" y="367.5" font-weight="500">surtout à commenter ?</tspan></text><rect x="720" y="280" width="400" height="105" rx="18" fill="#ECECE7" stroke="#D8D9D3" stroke-width="2"/><text x="920.0" y="311.5" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#202321"><tspan x="920.0" y="311.5" font-weight="700">Non</tspan><tspan x="920.0" y="339.5" font-weight="500">écriture, PDF et export</tspan><tspan x="920.0" y="367.5" font-weight="500">structurent le travail</tspan></text><rect x="40" y="520" width="300" height="120" rx="18" fill="#F4E5DF" stroke="#C66A4A" stroke-width="2"/><text x="190.0" y="559.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#202321"><tspan x="190.0" y="559.0" font-weight="700">Liseuse</tspan><tspan x="190.0" y="587.0" font-weight="500">lecture d&#x27;abord</tspan><tspan x="190.0" y="615.0" font-weight="500">annotations secondaires</tspan></text><rect x="450" y="520" width="300" height="120" rx="18" fill="#F4E5DF" stroke="#C66A4A" stroke-width="2"/><text x="600.0" y="559.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#202321"><tspan x="600.0" y="559.0" font-weight="700">Hybride</tspan><tspan x="600.0" y="587.0" font-weight="500">lecture + stylet</tspan><tspan x="600.0" y="615.0" font-weight="500">réellement équilibrés</tspan></text><rect x="860" y="520" width="300" height="120" rx="18" fill="#F4E5DF" stroke="#C66A4A" stroke-width="2"/><text x="1010.0" y="559.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#202321"><tspan x="1010.0" y="559.0" font-weight="700">Bloc-notes</tspan><tspan x="1010.0" y="587.0" font-weight="500">écriture, organisation</tspan><tspan x="1010.0" y="615.0" font-weight="500">et export d&#x27;abord</tspan></text></g></svg>