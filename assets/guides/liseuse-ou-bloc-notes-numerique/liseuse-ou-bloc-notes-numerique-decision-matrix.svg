<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 632" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Matrice comparant liseuse, appareil hybride avec stylet et bloc-notes numérique spécialisé.</title><desc id="svg-desc">La meilleure catégorie dépend du poids relatif de la lecture, de l&#x27;écriture et de l&#x27;export.</desc>
