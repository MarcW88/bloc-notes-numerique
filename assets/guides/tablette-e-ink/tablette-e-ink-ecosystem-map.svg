<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Carte des principales couches d&#x27;une tablette E Ink : écran, stylet, système, fichiers, cloud et export.</title><desc id="svg-desc">Deux appareils E Ink peuvent avoir des usages très différents selon leur logiciel et leur écosystème.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#202321" flood-opacity="0.08"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9A9D98"/></marker></defs>
<rect width="1200" height="460" rx="28" fill="#F7F6F1"/><text x="60" y="58" font-family="Newsreader, Georgia, serif" font-size="38" font-weight="600" fill="#202321">Une tablette E Ink est un système, pas seulement un écran</text><text x="60" y="92" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#6B6E6A">Matériel, logiciel, stylet, fichiers et cloud déterminent l&#x27;usage.</text><g filter="url(#shadow)"><rect x="70.0" y="160" width="194.4" height="160" rx="18" fill="#52675A" stroke="#52675A" stroke-width="2"/><text x="167.2" y="233.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#FFFFFF"><tspan x="167.2" y="233.0" font-weight="700">Écran E Ink</tspan><tspan x="167.2" y="261.0" font-weight="500">Affichage et rafraîchissement</tspan></text><path d="M 264.4 240.0 L 281.4 240.0" stroke="#9A9D98" stroke-width="3" marker-end="url(#arrow)"/><rect x="286.4" y="160" width="194.4" height="160" rx="18" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="2"/><text x="383.59999999999997" y="233.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#202321"><tspan x="383.59999999999997" y="233.0" font-weight="700">Stylet</tspan><tspan x="383.59999999999997" y="261.0" font-weight="500">Écriture et interaction</tspan></text><path d="M 480.8 240.0 L 497.8 240.0" stroke="#9A9D98" stroke-width="3" marker-end="url(#arrow)"/><rect x="502.8" y="160" width="194.4" height="160" rx="18" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="2"/><text x="600.0" y="233.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#202321"><tspan x="600.0" y="233.0" font-weight="700">Système</tspan><tspan x="600.0" y="261.0" font-weight="500">Interface et applications</tspan></text><path d="M 697.2 240.0 L 714.2 240.0" stroke="#9A9D98" stroke-width="3" marker-end="url(#arrow)"/><rect x="719.2" y="160" width="194.4" height="160" rx="18" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="2"/><text x="816.4000000000001" y="233.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#202321"><tspan x="816.4000000000001" y="233.0" font-weight="700">Documents</tspan><tspan x="816.4000000000001" y="261.0" font-weight="500">PDF, ebooks et notes</tspan></text><path d="M 913.6 240.0 L 930.6 240.0" stroke="#9A9D98" stroke-width="3" marker-end="url(#arrow)"/><rect x="935.6" y="160" width="194.4" height="160" rx="18" fill="#F4E5DF" stroke="#C66A4A" stroke-width="2"/><text x="1032.8" y="233.0" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#202321"><tspan x="1032.8" y="233.0" font-weight="700">Cloud / export</tspan><tspan x="1032.8" y="261.0" font-weight="500">Sortie et circulation des données</tspan></text></g></svg>