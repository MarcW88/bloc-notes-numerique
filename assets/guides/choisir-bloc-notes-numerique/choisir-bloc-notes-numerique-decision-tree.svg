<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Arbre de décision pour choisir une famille de bloc-notes numérique selon l&#x27;usage principal, le besoin d&#x27;applications tierces, la lecture et la taille des PDF.</title>
  <desc id="svg-desc">Ce schéma sert à réduire le nombre de familles à examiner. Avant tout achat, vérifiez ensuite les formats, le cloud, l&#x27;export et le coût total.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#202321" flood-opacity="0.08"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9A9D98"/></marker>
  </defs>
  <rect width="1200" height="940" rx="28" fill="#F7F6F1"/>
  <text x="60" y="58" font-family="Newsreader, Georgia, serif" font-size="38" font-weight="600" fill="#202321">Quel type de bloc-notes numérique examiner en premier ?</text>
  <text x="60" y="92" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#6B6E6A">Partez de votre tâche dominante, puis appliquez les critères éliminatoires du guide.</text>
  <g filter="url(#shadow)"><path d="M 600.0 207 C 600.0 261.0, 205.0 261.0, 205.0 315" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 600.0 207 C 600.0 261.0, 600.0 261.0, 600.0 315" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 600.0 207 C 600.0 261.0, 995.0 261.0, 995.0 315" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 205.0 407 C 205.0 453.5, 205.0 453.5, 205.0 500" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 600.0 407 C 600.0 461.0, 600.0 461.0, 600.0 515" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 995.0 407 C 995.0 453.5, 995.0 453.5, 995.0 500" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 205.0 600 C 205.0 657.5, 155.5 657.5, 155.5 715" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="142.25" y="632.5" width="76" height="28" rx="14" fill="#F7F6F1"/><text x="180.25" y="652.5" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B6E6A">Oui</text><path d="M 205.0 600 C 205.0 657.5, 452.5 657.5, 452.5 715" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="290.75" y="632.5" width="76" height="28" rx="14" fill="#F7F6F1"/><text x="328.75" y="652.5" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B6E6A">Non</text><path d="M 995.0 600 C 995.0 657.5, 805.0 657.5, 805.0 715" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="862.0" y="632.5" width="76" height="28" rx="14" fill="#F7F6F1"/><text x="900.0" y="652.5" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B6E6A">Oui</text><path d="M 995.0 600 C 995.0 657.5, 1060.0 657.5, 1060.0 715" fill="none" stroke="#9A9D98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="989.5" y="632.5" width="76" height="28" rx="14" fill="#F7F6F1"/><text x="1027.5" y="652.5" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B6E6A">Non</text><g id="node-start"><rect x="370" y="125" width="460" height="82" rx="18" fill="#52675A" stroke="#52675A" stroke-width="2"/><text text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="23" fill="#FFFFFF"><tspan x="600.0" y="173.0" font-weight="700">Quel est votre usage dominant ?</tspan></text></g><g id="node-notes"><rect x="55" y="315" width="300" height="92" rx="18" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="2"/><text text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#202321"><tspan x="205.0" y="354.0" font-weight="700">Notes, réunions</tspan><tspan x="205.0" y="382.0" font-weight="500">et écriture</tspan></text></g><g id="node-lecture"><rect x="450" y="315" width="300" height="92" rx="18" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="2"/><text text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#202321"><tspan x="600.0" y="354.0" font-weight="700">Lecture +</tspan><tspan x="600.0" y="382.0" font-weight="500">annotations</tspan></text></g><g id="node-pdf"><rect x="845" y="315" width="300" height="92" rx="18" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="2"/><text text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#202321"><tspan x="995.0" y="354.0" font-weight="700">PDF complexes</tspan><tspan x="995.0" y="382.0" font-weight="500">et documents</tspan></text></g><g id="node-apps"><rect x="55" y="500" width="300" height="100" rx="18" fill="#ECECE7" stroke="#D8D9D3" stroke-width="2"/><text text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="19" fill="#202321"><tspan x="205.0" y="543.0" font-weight="700">Apps tierces ou</tspan><tspan x="205.0" y="571.0" font-weight="500">Android indispensables ?</tspan></text></g><g id="node-reading-result"><rect x="450" y="515" width="300" height="115" rx="18" fill="#F4E5DF" stroke="#C66A4A" stroke-width="2"/><text text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="19" fill="#202321"><tspan x="600.0" y="551.5" font-weight="700">Liseuse + stylet</tspan><tspan x="600.0" y="579.5" font-weight="500">Kindle Scribe / Kobo</tspan><tspan x="600.0" y="607.5" font-weight="500">à examiner d&#x27;abord</tspan></text></g><g id="node-mobility"><rect x="845" y="500" width="300" height="100" rx="18" fill="#ECECE7" stroke="#D8D9D3" stroke-width="2"/><text text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="19" fill="#202321"><tspan x="995.0" y="543.0" font-weight="700">Mobilité quotidienne</tspan><tspan x="995.0" y="571.0" font-weight="500">prioritaire ?</tspan></text></g><g id="node-android"><rect x="18" y="715" width="275" height="110" rx="18" fill="#F4E5DF" stroke="#C66A4A" stroke-width="2"/><text text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#202321"><tspan x="155.5" y="749.0" font-weight="700">Oui → Android E Ink</tspan><tspan x="155.5" y="777.0" font-weight="500">BOOX et équivalents</tspan><tspan x="155.5" y="805.0" font-weight="500">à vérifier</tspan></text></g><g id="node-specialized"><rect x="315" y="715" width="275" height="110" rx="18" fill="#F4E5DF" stroke="#C66A4A" stroke-width="2"/><text text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#202321"><tspan x="452.5" y="749.0" font-weight="700">Non → carnet spécialisé</tspan><tspan x="452.5" y="777.0" font-weight="500">reMarkable / Supernote</tspan><tspan x="452.5" y="805.0" font-weight="500">à examiner</tspan></text></g><g id="node-ten-inch"><rect x="690" y="715" width="230" height="110" rx="18" fill="#F4E5DF" stroke="#C66A4A" stroke-width="2"/><text text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#202321"><tspan x="805.0" y="749.0" font-weight="700">Oui → 10,3 pouces</tspan><tspan x="805.0" y="777.0" font-weight="500">compromis mobilité</tspan><tspan x="805.0" y="805.0" font-weight="500">et surface</tspan></text></g><g id="node-large"><rect x="945" y="715" width="230" height="110" rx="18" fill="#F4E5DF" stroke="#C66A4A" stroke-width="2"/><text text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#202321"><tspan x="1060.0" y="749.0" font-weight="700">Non → grand format</tspan><tspan x="1060.0" y="777.0" font-weight="500">jusqu&#x27;à 13,3 pouces</tspan><tspan x="1060.0" y="805.0" font-weight="500">pour grands PDF</tspan></text></g><g id="node-gates"><rect x="205" y="865" width="790" height="58" rx="18" fill="#52675A" stroke="#52675A" stroke-width="2"/><text text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#FFFFFF"><tspan x="600.0" y="901.0" font-weight="700">Avant le modèle : formats → cloud → export → coût total</tspan></text></g></g>
</svg>