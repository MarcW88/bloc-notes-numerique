<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Décomposition du coût total d&#x27;un bloc-notes numérique entre appareil, stylet, protection, accessoires et abonnement éventuel.</title><desc id="svg-desc">N&#x27;ajoutez au coût total que les accessoires et services nécessaires à votre scénario.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#202321" flood-opacity="0.08"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9A9D98"/></marker></defs>
<rect width="1200" height="700" rx="28" fill="#F7F6F1"/><text x="60" y="58" font-family="Newsreader, Georgia, serif" font-size="38" font-weight="600" fill="#202321">Le vrai coût est celui de la configuration utilisable</text><text x="60" y="92" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#6B6E6A">Prix de l&#x27;appareil + éléments réellement nécessaires à votre usage.</text><g filter="url(#shadow)"><rect x="110" y="145" width="980" height="72" rx="16" fill="#52675A" stroke="#52675A" stroke-width="2"/><text x="138" y="176" text-anchor="start" font-family="Manrope, Arial, sans-serif" font-size="17" fill="#FFFFFF"><tspan x="138" y="176" font-weight="700">Appareil</tspan><tspan x="138" y="199" font-weight="500">Base de la configuration</tspan></text><text x="82" y="233" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="700" fill="#C66A4A">+</text><rect x="110" y="240" width="935" height="72" rx="16" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="2"/><text x="138" y="271" text-anchor="start" font-family="Manrope, Arial, sans-serif" font-size="17" fill="#202321"><tspan x="138" y="271" font-weight="700">Stylet</tspan><tspan x="138" y="294" font-weight="500">Inclus ou séparé selon le modèle</tspan></text><text x="82" y="328" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="700" fill="#C66A4A">+</text><rect x="110" y="335" width="890" height="72" rx="16" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="2"/><text x="138" y="366" text-anchor="start" font-family="Manrope, Arial, sans-serif" font-size="17" fill="#202321"><tspan x="138" y="366" font-weight="700">Protection</tspan><tspan x="138" y="389" font-weight="500">À pondérer selon la mobilité</tspan></text><text x="82" y="423" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="700" fill="#C66A4A">+</text><rect x="110" y="430" width="845" height="72" rx="16" fill="#FFFFFF" stroke="#D8D9D3" stroke-width="2"/><text x="138" y="461" text-anchor="start" font-family="Manrope, Arial, sans-serif" font-size="17" fill="#202321"><tspan x="138" y="461" font-weight="700">Clavier / accessoires</tspan><tspan x="138" y="484" font-weight="500">Seulement si utiles</tspan></text><text x="82" y="518" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="700" fill="#C66A4A">+</text><rect x="110" y="525" width="800" height="72" rx="16" fill="#F4E5DF" stroke="#C66A4A" stroke-width="2"/><text x="138" y="556" text-anchor="start" font-family="Manrope, Arial, sans-serif" font-size="17" fill="#202321"><tspan x="138" y="556" font-weight="700">Abonnement</tspan><tspan x="138" y="579" font-weight="500">Uniquement si une fonction nécessaire en dépend</tspan></text></g></svg>