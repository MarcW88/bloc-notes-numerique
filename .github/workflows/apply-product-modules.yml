name: Apply guarded product modules

on:
  push:
    branches: [main]
    paths:
      - '.content/products/**'
      - 'product_cards.py'
      - 'apply_product_cards.py'
      - 'validate_product_cards.py'
      - 'apply_inline_affiliate_links.py'
      - 'validate_inline_affiliate_links.py'
      - 'assets/product-cards.css'
      - 'assets/inline-affiliate.css'
      - 'assets/product-affiliate.js'
      - '.github/workflows/apply-product-modules.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply approved product modules
        run: python apply_product_cards.py all

      - name: Apply inline affiliate placements
        run: python apply_inline_affiliate_links.py

      - name: Validate affiliate placements
        run: |
          python validate_product_cards.py all
          python validate_inline_affiliate_links.py

      - name: Commit generated product placements
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comparatifs usages guides marques bons-plans
          git commit -m "content: apply guarded product affiliate placements"
          git pull --rebase origin main
          git push origin HEAD:main
