name: Apply homepage refresh

on:
  push:
    branches:
      - feature/homepage-refresh-before-indexing
    paths:
      - "scripts/refresh_homepage_before_indexing.py"
      - ".github/workflows/apply-homepage-refresh.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh homepage
        run: python scripts/refresh_homepage_before_indexing.py

      - name: Commit homepage
        shell: bash
        run: |
          git config user.name "Marc Williame"
          git config user.email "146358493+MarcW88@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage changes to commit"
          else
            git commit -m "feat(home): complete profiles and recent content"
            git push origin HEAD:${{ github.ref_name }}
          fi
