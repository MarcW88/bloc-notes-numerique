name: Test BFL API integration

on:
  push:
    branches:
      - feature/bfl-image-api
    paths:
      - '.github/workflows/test-bfl-api.yml'
      - 'scripts/generate_bfl_images.py'
      - '.content/image-requests/**'
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile generator
        run: python -m py_compile scripts/generate_bfl_images.py

      - name: Validate request schema
        run: python scripts/generate_bfl_images.py --check-only

      - name: Generate one disposable BFL image
        env:
          BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import urllib.error

          key = os.environ.get('BFL_API_KEY', '').strip()
          if not key:
              raise SystemExit('BFL_API_KEY secret is missing or empty')

          payload = json.dumps({
              'prompt': 'Photorealistic editorial photograph of a generic paper notebook and pen on a simple wooden desk, soft natural window light, realistic materials, no visible logo, no readable text',
              'width': 512,
              'height': 512,
              'output_format': 'png',
              'prompt_upsampling': False,
          }).encode('utf-8')

          req = urllib.request.Request(
              'https://api.bfl.ai/v1/flux-2-pro-preview',
              data=payload,
              headers={
                  'accept': 'application/json',
                  'Content-Type': 'application/json',
                  'x-key': key,
              },
              method='POST',
          )

          try:
              with urllib.request.urlopen(req, timeout=60) as response:
                  submitted = json.loads(response.read())
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode('utf-8', errors='replace')
              raise SystemExit(f'BFL submit failed HTTP {exc.code}: {detail[:1000]}')

          polling_url = submitted.get('polling_url')
          request_id = submitted.get('id')
          if not polling_url:
              raise SystemExit(f'No polling_url returned: {submitted}')
          print(f'BFL request accepted: {request_id}')

          for _ in range(180):
              time.sleep(1)
              poll = urllib.request.Request(
                  polling_url,
                  headers={'accept': 'application/json', 'x-key': key},
                  method='GET',
              )
              with urllib.request.urlopen(poll, timeout=60) as response:
                  result = json.loads(response.read())
              status = result.get('status')
              print(f'Status: {status}')
              if status == 'Ready':
                  sample = result.get('result', {}).get('sample')
                  if not sample:
                      raise SystemExit('Ready response has no result.sample')
                  with urllib.request.urlopen(sample, timeout=120) as image_response:
                      image = image_response.read()
                  if len(image) < 1000:
                      raise SystemExit(f'Downloaded image is unexpectedly small: {len(image)} bytes')
                  print(f'SUCCESS: BFL image generated and downloaded ({len(image)} bytes)')
                  raise SystemExit(0)
              if status in ('Error', 'Failed'):
                  raise SystemExit(f'BFL generation failed: {result}')

          raise SystemExit('Timed out waiting for BFL image')
          PY
