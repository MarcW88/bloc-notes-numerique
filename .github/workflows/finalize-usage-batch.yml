name: Finalize usage content batch

on:
  push:
    branches:
      - produce-usage-pages
    paths:
      - '.github/workflows/finalize-usage-batch.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: produce-usage-pages
          fetch-depth: 0

      - name: Mark seven usage records human-approved
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          records = []
          for path in sorted(Path('.content/usages').glob('*.json')):
              if path.name == '_template.json':
                  continue
              data = json.loads(path.read_text(encoding='utf-8'))
              data['status'] = 'HUMAN_APPROVED'
              data.setdefault('qa', {})['final_verdict'] = 'PASS'
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              records.append(path)

          if len(records) != 7:
              raise SystemExit(f'Expected 7 usage records, found {len(records)}')

          report = Path('.content/reviews/usages-batch-2026-09-09.md')
          text = report.read_text(encoding='utf-8')
          text = text.replace('Editorial QA: PASS at DRAFT_READY level.', 'Editorial QA: PASS — human approval received for the seven-page batch.')
          marker = '## Publication status\n'
          if marker in text:
              text = text.split(marker, 1)[0] + marker + 'The seven records are `HUMAN_APPROVED` following explicit user approval on 2026-09-09. `noindex,follow` remains intentionally preserved; indexation is a separate decision and was not requested.\n'
          report.write_text(text, encoding='utf-8')
          PY

      - name: Validate workflow and final state
        run: |
          python validate_usage_workflow.py
          python - <<'PY'
          import json
          from pathlib import Path

          slugs = []
          for path in sorted(Path('.content/usages').glob('*.json')):
              if path.name == '_template.json':
                  continue
              data = json.loads(path.read_text(encoding='utf-8'))
              assert data['status'] == 'HUMAN_APPROVED', path
              assert data['qa']['final_verdict'] == 'PASS', path
              slug = data['slug']
              html = Path('usages') / slug / 'index.html'
              content = html.read_text(encoding='utf-8')
              assert 'name="robots" content="noindex,follow"' in content, slug
              slugs.append(slug)
          assert len(slugs) == 7
          print('PASS: seven usage pages human-approved; noindex,follow preserved.')
          PY

      - name: Remove temporary workflow and commit finalization
        run: |
          rm .github/workflows/finalize-usage-batch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'content: finalize seven usage pages after human approval'
          git push origin HEAD:produce-usage-pages
