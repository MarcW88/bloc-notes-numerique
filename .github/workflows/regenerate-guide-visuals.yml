name: Regenerate guide visual assets

on:
  push:
    branches:
      - guide-visual-assets-all-guides
    paths:
      - 'guide_visual_catalog.py'
      - 'build_guide_visual_manifests.py'
      - 'apply_guide_visuals.py'
      - 'tools/guide-visual-assets-workflow/**'
      - '.github/workflows/regenerate-guide-visuals.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build manifests for all guides
        run: python build_guide_visual_manifests.py
      - name: Render every visual
        run: |
          for manifest in .content/visuals/*.json; do
            python tools/guide-visual-assets-workflow/scripts/render_visual_assets.py --manifest "$manifest"
          done
      - name: Validate SVG assets
        run: |
          for manifest in .content/visuals/*.json; do
            python tools/guide-visual-assets-workflow/scripts/validate_visual_assets.py "$manifest"
          done
      - name: Inject visuals into guide pages
        run: python apply_guide_visuals.py
      - name: Validate complete guide visual coverage
        run: python validate_guide_visuals.py
      - name: Commit generated visual batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .content/visuals/ assets/guides/ guides/
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "visual: generate one useful asset for every guide"
            git push origin HEAD:${{ github.ref_name }}
          fi
