name: Apply professional comparison pilot

on:
  push:
    branches: [comparison-editorial-publish-gate]
    paths:
      - "comparison_methodology.py"
      - "comparison_content_professional.py"
      - "apply_comparison_content.py"
      - "generate_comparison_metadata.py"
      - "validate_comparisons.py"
      - "validate_comparison_v2.py"
      - ".github/workflows/apply-comparison-pilot.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: comparison-editorial-publish-gate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render pilot and regenerate methodology
        run: |
          python3 apply_comparison_content.py
          python3 generate_comparison_metadata.py
      - name: Validate
        run: |
          python3 validate_comparisons.py
          python3 validate_comparison_v2.py
      - name: Commit generated outputs and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comparatifs/bloc-notes-numerique-professionnel/index.html .content/comparisons
          git rm .github/workflows/apply-comparison-pilot.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "content: regenerate professional comparison pilot"
          git push origin HEAD:comparison-editorial-publish-gate
