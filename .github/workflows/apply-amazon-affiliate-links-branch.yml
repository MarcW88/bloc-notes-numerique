name: Apply Amazon affiliate links on feature branch

on:
  push:
    branches:
      - feature/amazon-affiliate-links
    paths:
      - ".github/workflows/apply-amazon-affiliate-links-branch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render and validate product modules
        run: |
          python apply_product_cards.py all
          python validate_product_cards.py all

      - name: Commit rendered affiliate CTAs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comparatifs usages guides
          if ! git diff --cached --quiet; then
            git commit -m "affiliate: render Amazon CTAs with tracking"
            git push origin HEAD:${{ github.ref_name }}
          fi
