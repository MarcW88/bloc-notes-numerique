name: Update trust indexing policy

on:
  push:
    branches: [feature/final-indexing]
    paths:
      - "scripts/update_trust_indexing_policy.py"
      - ".github/workflows/update-trust-indexing-policy.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_trust_indexing_policy.py
      - name: Commit policy updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .content/trust/*.json
          if ! git diff --cached --quiet; then
            git commit -m "seo: allow indexing for trust pages"
            git push origin HEAD:${{ github.ref_name }}
          fi
