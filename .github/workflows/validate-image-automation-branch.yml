name: Validate image automation branch

on:
  push:
    branches:
      - feature/draw-things-image-automation

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile generator
        run: python -m py_compile scripts/generate_drawthings_images.py
      - name: Validate requests
        run: python scripts/generate_drawthings_images.py --check-only
