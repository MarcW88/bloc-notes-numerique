name: Generate pilot guide visual

on:
  push:
    branches:
      - guide-visual-assets-pilot
    paths:
      - ".content/visuals/choisir-bloc-notes-numerique.json"
      - "tools/guide-visual-assets-workflow/**"
      - "apply_guide_visuals.py"
      - "validate_guide_visual_pilot.py"
      - ".github/workflows/guide-visual-pilot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-and-integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render deterministic SVG
        run: |
          python tools/guide-visual-assets-workflow/scripts/render_visual_assets.py \
            --manifest .content/visuals/choisir-bloc-notes-numerique.json \
            --root .

      - name: Validate SVG structure
        run: |
          python tools/guide-visual-assets-workflow/scripts/validate_visual_assets.py \
            .content/visuals/choisir-bloc-notes-numerique.json \
            --root .

      - name: Inject visual into pilot guide
        run: python apply_guide_visuals.py .content/visuals/choisir-bloc-notes-numerique.json

      - name: Validate pilot integration
        run: python validate_guide_visual_pilot.py

      - name: Commit generated pilot asset and page
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/guides/choisir-bloc-notes-numerique guides/choisir-bloc-notes-numerique/index.html
          git commit -m "visual: generate choosing-guide decision tree"
          git push origin HEAD:${{ github.ref_name }}
