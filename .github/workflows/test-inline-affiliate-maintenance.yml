name: Test inline affiliate maintenance

on:
  push:
    branches:
      - feature/affiliate-inline-maintenance
    paths:
      - '.github/workflows/test-inline-affiliate-maintenance.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render and validate
        run: |
          python -m py_compile apply_inline_affiliate_links.py validate_inline_affiliate_links.py
          python apply_inline_affiliate_links.py
          python validate_inline_affiliate_links.py
          git diff --stat -- marques bons-plans
