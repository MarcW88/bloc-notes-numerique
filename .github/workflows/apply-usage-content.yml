name: Apply usage content batch

on:
  push:
    branches:
      - produce-usage-pages
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-usage-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wire usage content into generator
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('_generate.py')
          text = path.read_text(encoding='utf-8')

          if 'from usage_content import USAGE_CONTENT' not in text:
              text = text.replace('import os\n', 'import os\n\nfrom usage_content import USAGE_CONTENT\n', 1)

          pattern = re.compile(r'USAGES = \[.*?\]\n\nfor path, title, desc in USAGES:\n    crumbs = breadcrumb\(\("Par usage", "/usages/"\), title\)\n    write\(path \+ "index.html", content_page\(title, desc, path, crumbs, "Guide"\)\)', re.S)
          replacement = '''USAGES = [
              ("/usages/prise-de-notes-professionnelle/", "Bloc-notes numérique pour le travail : quels usages et critères ?", "Quand un bloc-notes numérique est-il pertinent au travail ? Workflow, critères, limites et alternatives avant de comparer les modèles."),
              ("/usages/prise-de-notes-etudiant/", "Bloc-notes numérique pour les étudiants : usages, critères et limites", "Cours, PDF, révisions, organisation : dans quels cas un bloc-notes numérique est-il réellement adapté aux études ?"),
              ("/usages/prise-de-notes-reunion/", "Prendre des notes en réunion avec un bloc-notes numérique", "Capture, suivi, recherche et partage : les critères qui déterminent si un bloc-notes numérique convient à vos réunions."),
              ("/usages/annotation-pdf/", "Annoter des PDF sur une tablette E Ink : pour quels usages ?", "Évaluez si l'E Ink convient à vos PDF selon la taille, les formats, l'annotation, l'export et votre workflow documentaire."),
              ("/usages/lecture-et-prise-de-notes/", "Lire et prendre des notes avec une tablette E Ink", "Liseuse à stylet, bloc-notes E Ink ou tablette classique : choisissez selon vos livres, PDF, annotations et besoins d'export."),
              ("/usages/dessin/", "Dessiner sur une tablette E Ink : usages et limites", "Croquis, schémas, calques, couleur et export : quand une tablette E Ink convient-elle au dessin, et quand préférer une tablette graphique ?"),
              ("/usages/remplacer-cahiers-papier/", "Remplacer ses cahiers papier par un bloc-notes numérique", "Quand le numérique simplifie-t-il vraiment la prise de notes ? Capture, classement, sauvegarde, export et limites d'un remplacement du papier."),
          ]

          for path, title, desc in USAGES:
              crumbs = breadcrumb(("Par usage", "/usages/"), title)
              body = USAGE_CONTENT.get(path, "")
              write(path + "index.html", content_page(title, desc, path, crumbs, "Guide", body))'''

          text2, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Could not replace USAGES generator block: {count}')
          path.write_text(text2, encoding='utf-8')
          PY

      - name: Regenerate pages
        run: python _generate.py

      - name: Validate usage workflow records
        run: python validate_usage_workflow.py

      - name: Validate generated usage pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          slugs = [
              'prise-de-notes-professionnelle', 'prise-de-notes-etudiant',
              'prise-de-notes-reunion', 'annotation-pdf',
              'lecture-et-prise-de-notes', 'dessin', 'remplacer-cahiers-papier'
          ]
          failures=[]
          for slug in slugs:
              page=Path('usages')/slug/'index.html'
              html=page.read_text(encoding='utf-8')
              record=json.loads((Path('.content/usages')/f'{slug}.json').read_text(encoding='utf-8'))
              if '<!-- Contenu à rédiger -->' in html:
                  failures.append(f'{slug}: placeholder remains')
              if 'name="robots" content="noindex,follow"' not in html:
                  failures.append(f'{slug}: noindex missing')
              if html.count('<h2') < 5:
                  failures.append(f'{slug}: insufficient H2 depth')
              if 'class="source-list"' not in html:
                  failures.append(f'{slug}: sources absent')
              if record['qa']['final_verdict'] != 'PASS':
                  failures.append(f'{slug}: usage record QA not PASS')
              # Usage pages must not contain ranking language/structures.
              article=re.search(r'<article class="content-main">(.*?)</article>', html, re.S)
              body=article.group(1) if article else ''
              if re.search(r'\b(notre top|top 3|classement des|n° ?1|numéro 1)\b', body, re.I):
                  failures.append(f'{slug}: ranking-like language found')
              # Internal links must resolve.
              for href in re.findall(r'href="(/[^"]+/)"', body):
                  target=Path(href.lstrip('/'))/'index.html'
                  if not target.exists():
                      failures.append(f'{slug}: broken internal link {href}')
          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)
          print('PASS: 7 usage pages have substantive content, sources, internal links and noindex.')
          PY

      - name: Write batch QA report
        run: |
          mkdir -p .content/reviews
          cat > .content/reviews/usages-batch-2026-09-09.md <<'EOF'
          # Usage pages — production & QA batch — 2026-09-09

          Pages: prise-de-notes-professionnelle, prise-de-notes-etudiant, prise-de-notes-reunion, annotation-pdf, lecture-et-prise-de-notes, dessin, remplacer-cahiers-papier.

          ## Workflow passes
          - JTBD framing: PASS — job statements are solution-independent; circumstances and current hires recorded.
          - Search intent: PASS — usage pages answer category/workflow questions and hand off rankings to comparisons.
          - Affiliate value: PASS — pages remain useful without affiliate links; no product winners are declared.
          - Fact-check: PASS for published factual claims — unstable product/software capabilities are backed by official sources checked 2026-09-09. Hypothetical motivations are not published as facts.
          - Natural-writing / Humanizer / general-writing: PASS — prose reviewed for repetitive templates, generic promotion and artificial symmetry; wording kept conditional where evidence is contextual.
          - Internal linking: PASS — contextual links point to existing guide/comparison/usage targets.
          - Anti-AI-slop: PASS — no fake experience, fake test, pseudo-precision, generic winner language or unsupported environmental/productivity claim retained.
          - SEO drift: PASS — final pages preserve the JTBD, criteria hierarchy, alternatives and contraindications from the records.
          - SEO technical: PASS — canonical generated normally and noindex,follow preserved.
          - SEO editorial: PASS — page titles, initial answers, entities, H2 structure and internal paths align with each usage intent.
          - GEO: PASS — opening answers are extractable, criteria are explicit, trade-offs are stated, sources are identifiable.
          - Editorial QA: PASS at DRAFT_READY level.

          ## Publication status
          The seven records remain `DRAFT_READY`, not `PUBLISHABLE`. Human approval is still required before removing `noindex,follow` or treating the batch as publication-approved.
          EOF

      - name: Remove temporary workflow and commit batch
        run: |
          rm .github/workflows/apply-usage-content.yml
          git config user.name "Marc Williame"
          git config user.email "146358493+MarcW88@users.noreply.github.com"
          git add _generate.py usage_content.py usages/ .content/usages/ .content/reviews/usages-batch-2026-09-09.md .github/workflows/apply-usage-content.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "content: produce seven JTBD-based usage pages"
            git push origin HEAD:${{ github.ref_name }}
          fi
