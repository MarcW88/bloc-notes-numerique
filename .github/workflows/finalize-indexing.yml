name: Finalize site indexing

on:
  push:
    branches:
      - feature/final-indexing
    paths:
      - "scripts/finalize_indexing.py"
      - ".github/workflows/finalize-indexing.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fit homepage hero and enable indexing
        run: python scripts/finalize_indexing.py

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css sitemap.xml '*.html' */**/*.html 2>/dev/null || true
          git add -u
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "seo: open public site to indexing"
            git push origin HEAD:${{ github.ref_name }}
          fi
