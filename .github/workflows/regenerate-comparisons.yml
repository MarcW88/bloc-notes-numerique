name: Regenerate comparison cluster

on:
  push:
    branches: [main]
    paths:
      - "comparison_products.py"
      - "comparison_pages.py"
      - "comparison_methodology.py"
      - "comparison_content.py"
      - "comparison_content_professional.py"
      - "apply_comparison_content.py"
      - "generate_comparison_metadata.py"
      - "validate_comparisons.py"
      - "validate_comparison_v2.py"
      - ".agents/skills/comparison-content-workflow/**"
      - ".agents/skills/comparison-editorial-publish-gate/**"
      - ".content/comparisons/README.md"
      - "comparison-workflow.config.yaml"
      - ".github/workflows/regenerate-comparisons.yml"
      - ".github/workflows/validate-comparisons.yml"
      - "_generate.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply comparison content
        run: python apply_comparison_content.py
      - name: Generate comparison methodology files
        run: python generate_comparison_metadata.py
      - name: Validate implemented comparison pipeline
        run: python validate_comparisons.py
      - name: Validate enriched v2 comparisons
        run: python validate_comparison_v2.py
      - name: Commit generated comparison pages
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comparatifs .content/comparisons
          git commit -m "content: regenerate comparison pages"
          git push
