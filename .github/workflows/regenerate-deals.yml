name: Regenerate deal pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - add-deal-content-workflow
    paths:
      - '.content/deals/**'
      - '.agents/skills/deal-content-workflow/**'
      - 'deal_content.py'
      - 'apply_deal_content.py'
      - 'validate_deal_workflow.py'
      - 'deal-workflow.config.yaml'
      - '.github/workflows/regenerate-deals.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deal content
        run: python apply_deal_content.py

      - name: Validate deal pages
        run: python validate_deal_workflow.py

      - name: Ensure noindex remains
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = list(Path('bons-plans').glob('*/index.html'))
          assert len(pages) == 7, f'Expected 7 deal pages, got {len(pages)}'
          for page in pages:
              text = page.read_text(encoding='utf-8')
              assert '<meta name="robots" content="noindex,follow">' in text, page
          print('PASS: noindex,follow preserved on 7 deal pages')
          PY

      - name: Commit generated state
        run: |
          if git diff --quiet -- _generate.py AGENTS.md bons-plans; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _generate.py AGENTS.md bons-plans
          git commit -m "content: apply verified deal workflow"
          git push
