name: Regenerate brand cluster

on:
  push:
    branches: [brand-content-all-pages, main]
    paths:
      - "brand_data.py"
      - "brand_render_common.py"
      - "brand_render_pages.py"
      - "brand_pages.py"
      - "apply_brand_content.py"
      - "generate_brand_metadata.py"
      - "validate_brands.py"
      - "brand-workflow.config.yaml"
      - ".agents/skills/brand-content-workflow/**"
      - ".github/workflows/regenerate-brands.yml"
      - "_generate.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply brand content
        run: python apply_brand_content.py
      - name: Generate brand audit files
        run: python generate_brand_metadata.py
      - name: Commit pilot brand pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marques/remarkable/index.html \
            marques/remarkable/remarkable-paper-pro/index.html \
            marques/remarkable/remarkable-paper-pro-avis/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "content: publish reMarkable editorial pilots"
          git push
      - name: Validate brand cluster
        run: python validate_brands.py
