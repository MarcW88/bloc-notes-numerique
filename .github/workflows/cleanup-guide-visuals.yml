name: Remove guide visual workflow and assets

on:
  push:
    branches:
      - remove-guide-visual-workflow
    paths:
      - '.github/workflows/cleanup-guide-visuals.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Strip injected guide visuals
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(
              r'\s*<!-- visual:start:[^>]+ -->.*?<!-- visual:end:[^>]+ -->\s*',
              re.S,
          )
          changed = []
          for page in sorted(Path('guides').glob('*/index.html')):
              html = page.read_text(encoding='utf-8')
              clean = pattern.sub('\n', html)
              if clean != html:
                  page.write_text(clean, encoding='utf-8')
                  changed.append(str(page))
          print(f'Removed injected visual blocks from {len(changed)} guide pages')
          for page in changed:
              print(page)
          PY

      - name: Remove visual workflow files and assets
        run: |
          rm -rf tools/guide-visual-assets-workflow
          rm -rf .content/visuals
          rm -rf assets/guides
          rm -f .github/workflows/generate-editorial-guide-images.yml
          rm -f .github/workflows/guide-visual-pilot.yml
          rm -f .github/workflows/regenerate-guide-visuals.yml
          rm -f apply_guide_visuals.py
          rm -f build_guide_visual_manifests.py
          rm -f guide_visual_catalog.py
          rm -f guide_visual_overrides.py
          rm -f validate_guide_visual_pilot.py
          rm -f validate_guide_visuals.py

      - name: Validate complete cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          issues = []
          guides = sorted(Path('guides').glob('*/index.html'))
          if len(guides) != 24:
              issues.append(f'Expected 24 guide pages, found {len(guides)}')

          for page in guides:
              html = page.read_text(encoding='utf-8')
              for token in ('data-visual-id=', '<!-- visual:start:', '<!-- visual:end:', '/assets/guides/'):
                  if token in html:
                      issues.append(f'{page}: visual reference remains ({token})')
              if '<meta name="robots" content="noindex,follow">' not in html:
                  issues.append(f'{page}: noindex,follow missing')

          forbidden_paths = [
              Path('tools/guide-visual-assets-workflow'),
              Path('.content/visuals'),
              Path('assets/guides'),
              Path('.github/workflows/generate-editorial-guide-images.yml'),
              Path('.github/workflows/guide-visual-pilot.yml'),
              Path('.github/workflows/regenerate-guide-visuals.yml'),
              Path('apply_guide_visuals.py'),
              Path('build_guide_visual_manifests.py'),
              Path('guide_visual_catalog.py'),
              Path('guide_visual_overrides.py'),
              Path('validate_guide_visual_pilot.py'),
              Path('validate_guide_visuals.py'),
          ]
          for path in forbidden_paths:
              if path.exists():
                  issues.append(f'Visual workflow path remains: {path}')

          if issues:
              print('\n'.join('FAIL: ' + issue for issue in issues))
              raise SystemExit(1)
          print('PASS: 24 guides contain no injected visual assets and all remain noindex,follow')
          PY

      - name: Remove temporary cleanup workflow
        run: rm -f .github/workflows/cleanup-guide-visuals.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit"
          else
            git commit -m "cleanup: remove guide visual workflow and assets"
            git push origin HEAD:${{ github.ref_name }}
          fi
