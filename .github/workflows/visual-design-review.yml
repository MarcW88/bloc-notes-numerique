name: Visual design review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "marques/**"
      - "comparatifs/**"
      - "style.css"
      - "comparisons.css"
      - "site.js"
      - ".agents/skills/site-design-review/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/visual-design-review.yml"
  pull_request:
    paths:
      - "marques/**"
      - "comparatifs/**"
      - "style.css"
      - "comparisons.css"
      - "site.js"
      - ".agents/skills/site-design-review/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/visual-design-review.yml"

jobs:
  visual-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scope: [brands, comparisons]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture ${{ matrix.scope }} pages
        run: >-
          node .agents/skills/site-design-review/scripts/run-visual-review.mjs
          --scope ${{ matrix.scope }}
          --output .artifacts/design-review/${{ matrix.scope }}

      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scope }}-design-review
          path: .artifacts/design-review/${{ matrix.scope }}/
          if-no-files-found: warn
          retention-days: 14
