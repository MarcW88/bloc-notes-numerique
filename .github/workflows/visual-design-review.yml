name: Visual design review

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "marques/**"
      - "style.css"
      - "site.js"
      - ".agents/skills/site-design-review/**"
      - "package.json"
      - "package-lock.json"

jobs:
  brand-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture brand pages
        run: npm run visual:brands

      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brand-design-review
          path: .artifacts/design-review/
          if-no-files-found: warn
          retention-days: 14
