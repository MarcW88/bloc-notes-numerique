name: Apply inline affiliate links on feature branch

on:
  push:
    branches:
      - feature/affiliate-inline-placements
    paths:
      - '.content/products/**'
      - 'apply_inline_affiliate_links.py'
      - 'validate_inline_affiliate_links.py'
      - 'assets/inline-affiliate.css'
      - '.github/workflows/apply-inline-affiliate-branch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply and validate inline affiliate links
        run: |
          python -m py_compile apply_inline_affiliate_links.py validate_inline_affiliate_links.py
          python apply_inline_affiliate_links.py
          python validate_inline_affiliate_links.py

      - name: Commit rendered inline affiliate links
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marques bons-plans
          if ! git diff --cached --quiet; then
            git commit -m "affiliate: render inline Amazon CTAs"
            git push origin HEAD:${{ github.ref_name }}
          fi
