name: Validate usage content workflow

on:
  push:
    paths:
      - 'AGENTS.md'
      - '.agents/skills/usage-analysis-workflow/**'
      - '.agents/skills/usage-content-workflow/**'
      - '.agents/skills/jobs-to-be-done/**'
      - '.agents/skills/content-audit/**'
      - '.agents/skills/search-intent/**'
      - '.agents/skills/content-refresh/**'
      - '.agents/skills/fact-check/**'
      - '.agents/skills/evidence-based-reviews/**'
      - '.agents/skills/affiliate-value/**'
      - '.agents/skills/content-brief-authoring/**'
      - '.agents/skills/content-and-copy/**'
      - '.agents/skills/internal-linking-audit/**'
      - '.agents/skills/humanizer/**'
      - '.agents/skills/general-writing/**'
      - '.agents/skills/anti-ai-slop/**'
      - '.agents/skills/seo-onpage/**'
      - '.agents/skills/seo-technical/**'
      - '.agents/skills/seo-best-practices/**'
      - '.agents/skills/editorial-qa/**'
      - '.content/usages/**'
      - 'usage-workflow.config.yaml'
      - 'validate_usage_workflow.py'
      - 'usages/**'
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.agents/skills/usage-analysis-workflow/**'
      - '.agents/skills/usage-content-workflow/**'
      - '.agents/skills/jobs-to-be-done/**'
      - '.agents/skills/content-audit/**'
      - '.agents/skills/search-intent/**'
      - '.agents/skills/content-refresh/**'
      - '.agents/skills/fact-check/**'
      - '.agents/skills/evidence-based-reviews/**'
      - '.agents/skills/affiliate-value/**'
      - '.agents/skills/content-brief-authoring/**'
      - '.agents/skills/content-and-copy/**'
      - '.agents/skills/internal-linking-audit/**'
      - '.agents/skills/humanizer/**'
      - '.agents/skills/general-writing/**'
      - '.agents/skills/anti-ai-slop/**'
      - '.agents/skills/seo-onpage/**'
      - '.agents/skills/seo-technical/**'
      - '.agents/skills/seo-best-practices/**'
      - '.agents/skills/editorial-qa/**'
      - '.content/usages/**'
      - 'usage-workflow.config.yaml'
      - 'validate_usage_workflow.py'
      - 'usages/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate two-workflow usage architecture
        run: python validate_usage_workflow.py
